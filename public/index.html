<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choicer Duo Dub</title><style>body{margin:0;background:#0e1015;color:#eee;font-family:system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#181b22;border:1px solid #303540;border-radius:18px;padding:20px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #3b414d}input,select{background:#0e1015;color:#fff;min-width:220px}button{background:#292e38;color:#fff;cursor:pointer}button:disabled{opacity:.4}.muted{color:#9ca3af}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.player{padding:12px;border:1px solid #353a46;border-radius:12px}.you{outline:2px solid #8b5cf6}.video{width:100%;max-height:560px;background:#000;border-radius:14px}.msg{color:#a5b4fc;min-height:24px}.host{display:none}.host.on{display:block}</style></head><body><div class="wrap"><div class="card"><h1>CHOICER DUO DUB</h1><p class="muted">Choose roles, load a video, and dub it together.</p></div><div class="card"><h2>Room</h2><div class="row"><input id="name" placeholder="Your name"><input id="room" placeholder="Room code"><button id="create">CREATE ROOM</button><button id="join">JOIN ROOM</button></div><p id="conn" class="msg">Connecting...</p><p id="roomText"></p></div><div class="card"><h2>Roles</h2><div id="players" class="players">No players yet.</div><p class="muted">Up to 8 players. Each role can only be taken once.</p></div><div id="host" class="card host"><h2>Host controls</h2><input id="videoUrl" placeholder="Direct .mp4/.webm video URL" style="width:min(100%,600px)"><div class="row" style="margin-top:10px"><button id="load">LOAD VIDEO</button><button id="start">START DUB</button><button id="play">PLAY</button><button id="pause">PAUSE</button></div><p class="muted">Use a direct video-file URL (ending in .mp4/.webm). A normal YouTube watch link will not work in the video player.</p></div><div class="card"><video id="vid" class="video" controls playsinline></video><p id="status" class="msg"></p></div></div><script>let ws,myId=null,isHost=false,roles=[],state=null,ignore=false;const $=id=>document.getElementById(id);function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>$('conn').textContent='Connected.';ws.onclose=()=>$('conn').textContent='Disconnected.';ws.onerror=()=>$('conn').textContent='Connection error.';ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error'){$('status').textContent=m.message;return}if(m.type==='joined'){myId=m.id;roles=m.roles;$('roomText').textContent='ROOM: '+m.room}if(m.type==='state'){state=m;isHost=state.players[0]?.id===myId;if(isHost)$('host').classList.add('on');else $('host').classList.remove('on');render()}}}function send(x){if(ws.readyState===1)ws.send(JSON.stringify(x))}$('create').onclick=()=>send({type:'create',name:$('name').value||'Player'});$('join').onclick=()=>send({type:'join',name:$('name').value||'Player',room:$('room').value.trim().toUpperCase()});$('load').onclick=()=>send({type:'video',url:$('videoUrl').value});$('start').onclick=()=>send({type:'start'});$('play').onclick=()=>send({type:'play',position:$('vid').currentTime});$('pause').onclick=()=>send({type:'pause',position:$('vid').currentTime});$('vid').addEventListener('play',()=>{if(isHost&&!ignore)send({type:'play',position:$('vid').currentTime})});$('vid').addEventListener('pause',()=>{if(isHost&&!ignore)send({type:'pause',position:$('vid').currentTime})});$('vid').addEventListener('seeked',()=>{if(isHost&&!ignore)send({type:'seek',position:$('vid').currentTime})});function render(){if(!state)return;$('players').innerHTML=state.players.map(p=>`<div class="player ${p.id===myId?'you':''}"><b>${esc(p.name)}</b><br>${p.role===null?'No role':esc(roles[p.role])}<br><select onchange="choose(${p.id===myId},this.value)" ${p.id!==myId||state.started?'disabled':''}><option value="">Choose role</option>${roles.map((r,i)=>`<option value="${i}" ${p.role===i?'selected':''} ${state.players.some(x=>x.id!==p.id&&x.role===i)?'disabled':''}>${esc(r)}</option>`).join('')}</select></div>`).join('');if(state.video&&$('vid').src!==state.video)$('vid').src=state.video;if(state.started&&Math.abs($('vid').currentTime-state.position)>.5){ignore=true;$('vid').currentTime=state.position;setTimeout(()=>ignore=false,100)}$('status').textContent=state.started?'Dub started — talk when your character appears.':'Choose a role. The host loads a video and starts.'}function choose(mine,v){if(mine&&v!=='')send({type:'role',role:Number(v)})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}connect();</script></body></html>
