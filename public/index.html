<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choicer - منصة الدوبلاج الجماعي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans flex flex-col justify-center items-center p-4">

  <!-- 1. شاشة الدخول (Lobby Join) -->
  <div id="auth-card" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
    <h1 class="text-3xl font-extrabold text-yellow-400 text-center mb-6">🎭 Choicer</h1>
    <div class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">اسمك</label>
        <input id="username" type="text" placeholder="مثال: أحمد" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-yellow-400">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">كود الغرفة</label>
        <input id="room-id" type="text" placeholder="مثال: ROOM1" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white uppercase focus:outline-none focus:border-yellow-400">
      </div>
      <button onclick="joinRoom()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-bold p-3 rounded-lg transition">دخول الغرفة 🚀</button>
    </div>
  </div>

  <!-- 2. غرفة العمليات (Main Room Container) -->
  <div id="room-card" class="hidden w-full max-w-5xl space-y-6">
    <!-- الهيدر والمعلومات -->
    <div class="bg-slate-900 p-4 rounded-xl flex justify-between items-center border border-slate-800">
      <div>
        <span class="text-slate-400">كود الغرفة:</span>
        <span id="display-room" class="font-bold text-yellow-400 text-lg mr-2"></span>
      </div>
      <div id="host-badge" class="hidden bg-red-500/20 text-red-400 text-xs px-3 py-1 rounded-full border border-red-500/30">أنت الـ Host</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- اليسار: اختيار الأدوار ورفع الفيديو -->
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-6">
        <div>
          <h3 class="font-bold mb-3 text-slate-200">🎭 اختر شخصيتك:</h3>
          <div id="roles-list" class="space-y-2"></div>
        </div>

        <div id="upload-section" class="hidden border-t border-slate-800 pt-4">
          <h3 class="font-bold mb-2 text-slate-200">🎬 رفع مقطع الفيديو:</h3>
          <input type="file" id="video-input" accept="video/*" class="text-sm text-slate-400 file:bg-slate-800 file:border-0 file:text-white file:px-3 file:py-2 file:rounded-lg cursor-pointer">
          <button onclick="uploadVideo()" class="mt-2 w-full bg-slate-800 hover:bg-slate-700 text-sm font-bold p-2 rounded-lg transition">رفع الفيديو</button>
        </div>
      </div>

      <!-- اليمين: منطقة المشاهدة والتسجيل -->
      <div class="md:col-span-2 bg-slate-900 p-5 rounded-xl border border-slate-800 flex flex-col items-center">
        <!-- مشغل الفيديو -->
        <video id="main-video" class="w-full rounded-lg bg-black aspect-video mb-4" controls></video>

        <!-- المؤشر والتنبيه الجاري -->
        <div id="dialogue-banner" class="w-full bg-slate-800 p-4 rounded-lg text-center mb-4 min-h-[80px] flex flex-col justify-center items-center">
          <p class="text-slate-400 text-sm">في انتظار تشغيل الفيديو...</p>
        </div>

        <!-- أزرار التسجيل والتحكم -->
        <div class="flex items-center gap-4">
          <button id="rec-btn" disabled onclick="toggleRecording()" class="bg-red-600 hover:bg-red-700 disabled:opacity-40 text-white font-bold px-6 py-3 rounded-full flex items-center gap-2 transition">
            <span id="rec-dot" class="w-3 h-3 bg-white rounded-full"></span>
            <span id="rec-text">المايك مقفل</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const socket = io();
    let myRoom = '', myUsername = '', mySocketId = '';
    let currentRole = null, myMediaRecorder = null, audioChunks = [];
    let isRecording = false, currentLineToRecord = null;
    let roomState = null;

    socket.on('connect', () => { mySocketId = socket.id; });

    // 1. الدخول للغرفة
    function joinRoom() {
      myUsername = document.getElementById('username').value.trim();
      myRoom = document.getElementById('room-id').value.trim().toUpperCase();

      if (!myUsername || !myRoom) return alert('الرجاء كتابة الاسم وكود الغرفة');

      socket.emit('join_room', { roomId: myRoom, username: myUsername });

      document.getElementById('auth-card').classList.add('hidden');
      document.getElementById('room-card').classList.remove('hidden');
      document.getElementById('display-room').innerText = myRoom;
    }

    // 2. تحديث بيانات الغرفة والأدوار
    socket.on('room_updated', (room) => {
      roomState = room;

      // إظهار لوحة التحكم للـ Host فقط
      if (room.host === mySocketId) {
        document.getElementById('host-badge').classList.remove('hidden');
        document.getElementById('upload-section').classList.remove('hidden');
      }

      // تحديث الفيديو إذا تم رفعه
      const videoEl = document.getElementById('main-video');
      if (room.videoUrl && videoEl.src !== window.location.origin + room.videoUrl) {
        videoEl.src = room.videoUrl;
      }

      // عرض الأدوار المتاحة
      const rolesList = document.getElementById('roles-list');
      rolesList.innerHTML = '';

      const characters = ['Sherry', 'Nozomi'];
      characters.forEach(char => {
        const takenBySocket = room.roles[char];
        const isMine = takenBySocket === mySocketId;
        const isTaken = !!takenBySocket;

        const btn = document.createElement('button');
        btn.className = `w-full p-3 rounded-lg border text-right font-bold transition flex justify-between items-center ${
          isMine ? 'bg-green-600/20 border-green-500 text-green-400' :
          isTaken ? 'bg-slate-800/50 border-slate-800 text-slate-500 cursor-not-allowed' :
          'bg-slate-800 border-slate-700 text-white hover:border-yellow-400'
        }`;

        const holderName = isTaken ? (room.players[takenBySocket]?.username || 'لاعب') : 'متاح';
        btn.innerHTML = `<span>🎭 ${char}</span> <span class="text-xs font-normal opacity-75">${isMine ? 'دورك أنت' : holderName}</span>`;
        
        if (!isTaken) btn.onclick = () => selectRole(char);
        rolesList.appendChild(btn);
      });
    });

    // 3. اختيار الدور
    function selectRole(char) {
      currentRole = char;
      socket.emit('select_role', { character: char });
    }

    // 4. رفع الفيديو بواسطة الـ Host
    async function uploadVideo() {
      const fileInput = document.getElementById('video-input');
      if (!fileInput.files[0]) return alert('اختر ملف فيديو أولاً');

      const formData = new FormData();
      formData.append('video', fileInput.files[0]);

      const res = await fetch('/api/upload-video', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.videoUrl) {
        socket.emit('set_video_url', { videoUrl: data.videoUrl });
      }
    }

    // 5. مزامنة أحداث الفيديو (Play/Pause/Seek)
    const videoEl = document.getElementById('main-video');

    videoEl.onplay = () => socket.emit('video_action', { action: 'play', currentTime: videoEl.currentTime });
    videoEl.onpause = () => socket.emit('video_action', { action: 'pause', currentTime: videoEl.currentTime });

    socket.on('sync_video', ({ action, currentTime }) => {
      if (Math.abs(videoEl.currentTime - currentTime) > 0.3) {
        videoEl.currentTime = currentTime;
      }
      if (action === 'play' && videoEl.paused) videoEl.play();
      if (action === 'pause' && !videoEl.paused) videoEl.pause();
    });

    // 6. متابعة التوقيت وعرض الجمل الحالية أثناء التشغيل
    videoEl.ontimeupdate = () => {
      if (!roomState || !roomState.dialogueLines) return;

      const time = videoEl.currentTime;
      const activeLine = roomState.dialogueLines.find(l => time >= l.start && time <= l.end);
      const banner = document.getElementById('dialogue-banner');
      const recBtn = document.getElementById('rec-btn');

      if (activeLine) {
        const isMyTurn = currentRole && activeLine.character === currentRole;
        banner.innerHTML = `
          <div class="text-xs text-yellow-400 font-bold mb-1">${activeLine.character.toUpperCase()}</div>
          <div class="text-lg font-extrabold text-white">"${activeLine.text}"</div>
          ${isMyTurn ? '<div class="text-xs text-green-400 mt-1 font-bold animate-pulse">🎙️ جاء دورك للدبلجة!</div>' : ''}
        `;

        if (isMyTurn) {
          recBtn.disabled = false;
          currentLineToRecord = activeLine.id;
        } else {
          recBtn.disabled = true;
        }
      } else {
        banner.innerHTML = `<p class="text-slate-500 text-sm">استمع للمشهد...</p>`;
        recBtn.disabled = true;
      }

      // تشغيل الأصوات المسجلة تلقائياً بالتزامن مع الفيديو
      if (roomState.recordings) {
        Object.keys(roomState.recordings).forEach(lineId => {
          const rec = roomState.recordings[lineId];
          const line = roomState.dialogueLines.find(l => l.id == lineId);
          if (line && Math.abs(time - line.start) < 0.2 && !rec.played) {
            rec.played = true;
            const audio = new Audio(rec.audioData);
            audio.play();
          }
        });
      }
    };

    // reset playback audio states on seek
    videoEl.onseeking = () => {
      if (roomState && roomState.recordings) {
        Object.values(roomState.recordings).forEach(r => r.played = false);
      }
    };

    // 7. نظام تسجيل الصوت والمايك بالمتصفح
    async function toggleRecording() {
      if (!isRecording) {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        myMediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        myMediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        myMediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => {
            socket.emit('submit_audio', {
              lineId: currentLineToRecord,
              audioBase64: reader.result
            });
          };
        };

        myMediaRecorder.start();
        isRecording = true;
        document.getElementById('rec-text').innerText = 'جاري التسجيل... 🔴';
      } else {
        myMediaRecorder.stop();
        isRecording = false;
        document.getElementById('rec-text').innerText = 'تم التسجيل ✓';
      }
    }

    socket.on('audio_recorded', ({ lineId, username }) => {
      console.log(`تم تسليم التسجيل للجملة ${lineId} بواسطة ${username}`);
    });
  </script>
</body>
</html>
