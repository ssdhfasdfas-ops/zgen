<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choicer Duo Dub</title><style>body{margin:0;background:#0d0f14;color:#eee;font-family:system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.card{background:#171a21;border:1px solid #303541;border-radius:18px;padding:20px;margin:14px 0}.row{display:flex;gap:9px;flex-wrap:wrap}input,button,select{font:inherit;padding:11px;border-radius:10px;border:1px solid #3b414d}input,select{background:#0d0f14;color:#fff}button{background:#292e38;color:#fff;cursor:pointer}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.player{padding:12px;border:1px solid #343945;border-radius:12px}.you{outline:2px solid #8b5cf6}video{width:100%;max-height:600px;background:#000;border-radius:14px}.host{display:none}.host.on{display:block}.msg{min-height:24px;color:#a5b4fc}.score{font-size:42px;font-weight:800}</style></head><body><div class="wrap"><div class="card"><h1>CHOICER DUO DUB</h1><p>Upload a clip, pick roles, record your lines, and compare the spoken words.</p></div><div class="card"><h2>Room</h2><div class="row"><input id="name" placeholder="Your name"><input id="room" placeholder="Room code"><button id="create">CREATE ROOM</button><button id="join">JOIN ROOM</button></div><p id="conn" class="msg">Connecting...</p><p id="roomText"></p></div><div class="card"><h2>Players & roles</h2><div id="players" class="players">No players yet.</div></div><div id="host" class="card host"><h2>Host</h2><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"><div class="row"><button id="load">LOAD VIDEO</button><button id="start">START DUB</button><button id="play">PLAY</button><button id="pause">PAUSE</button></div><p>For this prototype, videos are sent through the room connection. Keep clips reasonably small.</p></div><div class="card"><video id="vid" controls playsinline></video><div class="row"><button id="record">🎙️ START RECORDING</button><button id="stop" disabled>STOP</button><button id="clear">CLEAR MY TAKE</button></div><p id="recStatus" class="msg"></p></div><div class="card"><h2>Match</h2><input id="reference" placeholder="Reference line / script" style="width:min(100%,700px)"><div class="row"><button id="score">CALCULATE MATCH</button></div><div id="result"></div></div></div><script>
let ws,myId=null,isHost=false,roles=[],state=null,rec=null,chunks=[],stream=null,url=null,recognition=null,transcript='';const $=id=>document.getElementById(id);
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>$('conn').textContent='Connected.';ws.onclose=()=>$('conn').textContent='Disconnected.';ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='error')return $('recStatus').textContent=m.message;if(m.type==='joined'){myId=m.id;roles=m.roles;$('roomText').textContent='ROOM: '+m.room;isHost=true;$('host').classList.add('on')}if(m.type==='state'){state=m;isHost=state.players[0]?.id===myId;if(isHost)$('host').classList.add('on');render()}if(m.type==='sync'&&!isHost)sync(m.action,m.position)}}
function send(x){if(ws.readyState===1)ws.send(JSON.stringify(x))}$('create').onclick=()=>send({type:'create',name:$('name').value||'Player'});$('join').onclick=()=>{isHost=false;send({type:'join',name:$('name').value||'Player',room:$('room').value.trim().toUpperCase()})};$('load').onclick=()=>{let f=$('videoFile').files[0];if(!f)return $('recStatus').textContent='Choose a video first.';if(f.size>120*1024*1024)return $('recStatus').textContent='Keep the clip under 120 MB.';let r=new FileReader();r.onload=()=>send({type:'video',name:f.name,video:r.result});r.readAsDataURL(f)};$('start').onclick=()=>send({type:'start'});$('play').onclick=()=>send({type:'sync',action:'play',position:$('vid').currentTime});$('pause').onclick=()=>send({type:'sync',action:'pause',position:$('vid').currentTime});$('vid').onplay=()=>{if(isHost)send({type:'sync',action:'play',position:$('vid').currentTime})};$('vid').onpause=()=>{if(isHost)send({type:'sync',action:'pause',position:$('vid').currentTime})};$('vid').onseeked=()=>{if(isHost)send({type:'sync',action:'seek',position:$('vid').currentTime})};
function sync(a,p){let v=$('vid');if(Math.abs(v.currentTime-p)>.6)v.currentTime=p;if(a==='play')v.play().catch(()=>{});if(a==='pause')v.pause()}function render(){if(!state)return;$('players').innerHTML=state.players.map(p=>'<div class="player '+(p.id===myId?'you':'')+'"><b>'+esc(p.name)+'</b><br>'+(p.role===null?'No role':esc(roles[p.role]))+'<br><select '+(p.id!==myId||state.started?'disabled':'')+' onchange="choose(this.value)"><option value="">Choose role</option>'+roles.map((r,i)=>'<option value="'+i+'" '+(p.role===i?'selected':'')+' '+(state.players.some(x=>x.id!==p.id&&x.role===i)?'disabled':'')+'>'+esc(r)+'</option>').join('')+'</select></div>').join('');if(state.video&&$('vid').dataset.v!==state.video.data){$('vid').dataset.v=state.video.data;$('vid').src=state.video.data;$('vid').load()}}window.choose=v=>{if(v!=='')send({type:'role',role:Number(v)})};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function startRecord(){try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{let b=new Blob(chunks,{type:rec.mimeType||'audio/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('recStatus').textContent='Take recorded.';stream.getTracks().forEach(t=>t.stop())};rec.start();$('record').disabled=true;$('stop').disabled=false;$('recStatus').textContent='Recording...';startSpeech()}catch(e){$('recStatus').textContent='Microphone permission was denied or unavailable.'}}
function startSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('recStatus').textContent+=' Speech recognition is not supported in this browser.';return}transcript='';recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';recognition.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';transcript=s.trim()};recognition.start()}$('record').onclick=startRecord;$('stop').onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop();if(recognition)try{recognition.stop()}catch{}recognition=null;$('record').disabled=false;$('stop').disabled=true};$('clear').onclick=()=>{transcript='';if(url)URL.revokeObjectURL(url);url=null;$('recStatus').textContent='Take cleared.'};$('score').onclick=()=>{let a=norm($('reference').value),b=norm(transcript);if(!a||!b)return $('result').textContent='Enter a reference line and record a take first.';let n=a.split(' '),m=b.split(' '),d=Array(n.length+1).fill(0).map(()=>Array(m.length+1).fill(0));for(let i=0;i<=n.length;i++)d[i][0]=i;for(let j=0;j<=m.length;j++)d[0][j]=j;for(let i=1;i<=n.length;i++)for(let j=1;j<=m.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(n[i-1]===m[j-1]?0:1));let s=Math.max(0,1-d[n.length][m.length]/Math.max(n.length,m.length));$('result').innerHTML='<div class="score">'+Math.round(s*100)+'%</div><p>Word-match score</p><p>Recognized: '+esc(b)+'</p>'+(url?'<audio controls src="'+url+'"></audio>':'')};function norm(s){return s.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim()}connect();</script></body></html>
