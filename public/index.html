<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choicer - منصة الدوبلاج الجماعية المباشرة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans flex flex-col justify-center items-center p-4">

  <!-- 1. شاشة الدخول والتسمية -->
  <div id="auth-card" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
    <h1 class="text-3xl font-extrabold text-yellow-400 text-center mb-6">🎭 Choicer Multiplayer</h1>
    <p class="text-xs text-slate-400 text-center mb-6">دوبلاج جماعي مباشر وتزامن كلي بين الجميع</p>
    <div class="space-y-4">
      <div>
        <label class="block text-sm text-slate-400 mb-1">اسمك (اختر الاسم الذي تحبه):</label>
        <input id="username" type="text" placeholder="اكتب اسمك هنا..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-yellow-400">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">كود الغرفة:</label>
        <input id="room-id" type="text" placeholder="مثال: DUB1" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white uppercase focus:outline-none focus:border-yellow-400">
      </div>
      <button onclick="joinRoom()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-bold p-3 rounded-lg transition">دخول الغرفة 🚀</button>
    </div>
  </div>

  <!-- 2. غرفة الدوبلاج الجماعية -->
  <div id="room-card" class="hidden w-full max-w-5xl space-y-6">
    
    <!-- الشريط العلوي -->
    <div class="bg-slate-900 p-4 rounded-xl flex justify-between items-center border border-slate-800">
      <div>
        <span class="text-slate-400">رمز الغرفة:</span>
        <span id="display-room" class="font-bold text-yellow-400 text-lg mr-2"></span>
      </div>
      <div id="status-indicator" class="bg-slate-800 text-yellow-400 text-xs px-3 py-1 rounded-full border border-slate-700">🔄 بانتظار تجهيز الفيديو</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- القائمة الجانبية: المتواجدون بالأدوار -->
      <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-6">
        <div>
          <h3 class="font-bold mb-3 text-slate-200">👥 المتواجدون بالأدوار:</h3>
          <div id="players-list" class="space-y-2"></div>
        </div>

        <div id="upload-section" class="hidden border-t border-slate-800 pt-4">
          <h3 class="font-bold mb-2 text-slate-200">🎬 اختيار ورفع المقطع:</h3>
          <p class="text-xs text-slate-400 mb-2">الموقع سيتعرف على المقطع ويقسمه بالتساوي بينكم تلقائياً!</p>
          <input type="file" id="video-input" accept="video/*" class="w-full text-xs text-slate-400 file:bg-slate-800 file:border-0 file:text-white file:px-3 file:py-2 file:rounded-lg cursor-pointer">
          <button onclick="uploadVideo()" class="mt-3 w-full bg-yellow-400 hover:bg-yellow-500 text-slate-950 font-bold text-sm p-2.5 rounded-lg transition">رفع وبدء المشهد 🚀</button>
        </div>
      </div>

      <!-- منطقة العرض والتسجيل والمزامنة -->
      <div class="md:col-span-2 bg-slate-900 p-5 rounded-xl border border-slate-800 flex flex-col items-center">
        
        <!-- مشغل الفيديو متزامن -->
        <video id="main-video" class="w-full rounded-lg bg-black aspect-video mb-4 pointer-events-none" playsinline></video>

        <!-- كرت حالة الحوار والأنيميشن -->
        <div id="turn-banner" class="w-full bg-slate-800 p-4 rounded-xl text-center mb-4 min-h-[90px] flex flex-col justify-center items-center border border-slate-700">
          <p class="text-slate-400 text-sm">ارفع مقطع فيديو للبدء في تقسيم الأدوار والمزامنة...</p>
        </div>

        <!-- أزرار التحكم بالتسجيل المباشر والسمع والاستمرار -->
        <div id="controls-panel" class="w-full flex flex-col items-center gap-3">
          
          <div id="rec-controls" class="flex flex-wrap justify-center items-center gap-3">
            <button id="rec-btn" disabled onclick="handleRecClick()" class="bg-red-600 hover:bg-red-700 disabled:opacity-30 text-white font-bold px-6 py-3 rounded-full flex items-center gap-2 transition shadow-lg">
              <span id="rec-dot" class="w-3 h-3 bg-white rounded-full"></span>
              <span id="rec-text">المايك جاهز لدورك</span>
            </button>

            <!-- زر سماع الصوت للجميع بنفس الوقت واستبدال الصوت الأصلي -->
            <button id="listen-btn" onclick="triggerListenBroadcast()" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-3 rounded-xl flex items-center gap-2 text-sm transition">
              ▶️ إسماع الجميع الدوبلاج بالتوقيت
            </button>

            <!-- زر إعادة التسجيل -->
            <button id="retry-btn" onclick="retryRecording()" class="hidden bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 py-3 rounded-xl flex items-center gap-2 text-sm transition">
              🔄 إعادة التسجيل
            </button>

            <!-- زر الاعتماد والاستمرار للدور التالي -->
            <button id="continue-btn" onclick="nextTurnBroadcast()" class="hidden bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-3 rounded-xl flex items-center gap-2 text-sm transition shadow-lg">
              ✅ اعتماد وانتقال للدور التالي ➔
            </button>
          </div>

          <!-- زر تشغيل العرض النهائي للمشهد كامل بالدوبلاج للجميع -->
          <button id="watch-full-btn" onclick="triggerFullDubBroadcast()" class="hidden bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-black px-8 py-4 rounded-xl text-lg shadow-xl hover:scale-105 transition">
            🎉 تشغيل المقطع الكامل بجميع الأصوات المدبلجة!
          </button>
        </div>

      </div>

    </div>
  </div>

  <script>
    const socket = io();
    let myRoom = '', myUsername = '', mySocketId = '';
    let roomState = null;
    let myMediaRecorder = null, audioChunks = [];
    let isRecording = false;
    let turnTimer = null;
    let activeDubAudio = null;

    socket.on('connect', () => { mySocketId = socket.id; });

    function joinRoom() {
      myUsername = document.getElementById('username').value.trim();
      myRoom = document.getElementById('room-id').value.trim().toUpperCase();

      if (!myUsername || !myRoom) return alert('الرجاء كتابة الاسم وكود الغرفة');

      socket.emit('join_room', { roomId: myRoom, username: myUsername });

      document.getElementById('auth-card').classList.add('hidden');
      document.getElementById('room-card').classList.remove('hidden');
      document.getElementById('display-room').innerText = myRoom;
    }

    socket.on('room_updated', (room) => {
      roomState = room;

      if (room.host === mySocketId) {
        document.getElementById('upload-section').classList.remove('hidden');
      }

      // تحديث قائمة الأعضاء بالأدوار
      const playersList = document.getElementById('players-list');
      playersList.innerHTML = '';
      room.players.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = `p-3 rounded-lg border text-sm font-bold flex justify-between items-center ${
          p.id === mySocketId ? 'bg-yellow-400/10 border-yellow-400 text-yellow-400' : 'bg-slate-800 border-slate-700 text-slate-300'
        }`;
        item.innerHTML = `<span>👤 ${p.username}</span> <span class="text-xs bg-slate-700 px-2 py-1 rounded">دور ${idx + 1}</span>`;
        playersList.appendChild(item);
      });

      // إعداد الفيديو
      const videoEl = document.getElementById('main-video');
      if (room.videoUrl && videoEl.src !== window.location.origin + room.videoUrl) {
        videoEl.src = room.videoUrl;
      }

      updateTurnUI();
    });

    async function uploadVideo() {
      const fileInput = document.getElementById('video-input');
      if (!fileInput.files[0]) return alert('اختر ملف فيديو أولاً');

      const formData = new FormData();
      formData.append('video', fileInput.files[0]);

      const res = await fetch('/api/upload-video', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.videoUrl) {
        const tempVideo = document.createElement('video');
        tempVideo.src = data.videoUrl;
        tempVideo.onloadedmetadata = () => {
          socket.emit('set_video_info', {
            videoUrl: data.videoUrl,
            duration: tempVideo.duration || 30
          });
        };
      }
    }

    function updateTurnUI() {
      if (!roomState || !roomState.turns || roomState.turns.length === 0) return;

      const currentTurn = roomState.turns[roomState.currentTurnIndex];
      const banner = document.getElementById('turn-banner');
      const recBtn = document.getElementById('rec-btn');
      const videoEl = document.getElementById('main-video');

      if (roomState.isCompleted) {
        banner.innerHTML = `<h2 class="text-xl font-extrabold text-green-400">🎉 اكتمل تسجيل كافة الحوارات!</h2><p class="text-slate-400 text-xs">اضغطوا الأزرار أدناه لمشاهدة المقطع النهائي بالدوبلاج.</p>`;
        document.getElementById('watch-full-btn').classList.remove('hidden');
        recBtn.disabled = true;
        return;
      }

      const isMyTurn = currentTurn.playerId === mySocketId;

      // ضبط وقت الفيديو للجميع ومكتوم حتى بداية التسجيل
      videoEl.currentTime = currentTurn.startTime;
      videoEl.muted = false; // الصوت الأصلي يظهر أثناء الانتظار

      banner.innerHTML = `
        <div class="text-xs font-bold text-yellow-400 mb-1">المرحلة ${currentTurn.index + 1} من ${roomState.turns.length} (التوقيت: ${formatTime(currentTurn.startTime)} - ${formatTime(currentTurn.endTime)})</div>
        <div class="text-xl font-black text-white">الدور الآن لـ: <span class="text-yellow-400">${currentTurn.playerUsername}</span></div>
        ${isMyTurn ? '<p class="text-xs text-green-400 font-bold mt-1 animate-bounce">🎙️ جاء دورك! اضغط على زر التسجيل وسيبدأ المقطع للجميع فوراً.</p>' : '<p class="text-xs text-slate-400 mt-1">⏳ بانتظار قيام خويّك ببدء التسجيل ليعمل المقطع عندكم معاً...</p>'}
      `;

      recBtn.disabled = !isMyTurn;
    }

    // 1. الضغط على زر التسجيل (ترسل إشارة للمظفرة لتشغيل المقطع عند الكل)
    function handleRecClick() {
      if (!isRecording) {
        socket.emit('start_recording_sync');
      }
    }

    // استلام إشارة بدء التسجيل من السيرفر (تُنفّذ عند الجميع بنفس اللحظة)
    socket.on('on_start_recording', async ({ turn, recorderSocketId }) => {
      const videoEl = document.getElementById('main-video');
      videoEl.currentTime = turn.startTime;

      if (recorderSocketId === mySocketId) {
        // صاحب الدور: يكتم الفيديو عنده حتى لا يلتقط المايك صوت الشخصية الأصلية، ويتم كتم الصوت الأصلي واستبداله بصوته!
        videoEl.muted = true;
        videoEl.play();

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        myMediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        myMediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        myMediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.readAsDataURL(blob);
          reader.onloadend = () => {
            socket.emit('stop_recording_sync', { audioBase64: reader.result });
          };
        };

        myMediaRecorder.start();
        isRecording = true;
        document.getElementById('rec-text').innerText = 'جاري تسجيل صوتك... 🔴';
        document.getElementById('rec-btn').classList.replace('bg-red-600', 'bg-amber-600');

      } else {
        // بقية المتواجدين في الغرفة: يعمل الفيديو عندهم أيضاً مع كتم الصوت الأصلي أثناء إدلاء خويّهم بالصوت
        videoEl.muted = true; // كتم أصوات الشخصيات الأصلية واستبدالها للدوبلاج
        videoEl.play();
        document.getElementById('rec-text').innerText = `جاري دوبلاج ${turn.playerUsername}... 🔴`;
      }

      // إيقاف تلقائي متزامن بعد انتهاء ثواني الدور
      const durationMs = (turn.endTime - turn.startTime) * 1000;
      clearTimeout(turnTimer);
      turnTimer = setTimeout(() => {
        videoEl.pause();
        if (isRecording && recorderSocketId === mySocketId) {
          myMediaRecorder.stop();
          isRecording = false;
        }
      }, durationMs);
    });

    // استلام إشارة تم التسجيل
    socket.on('on_stop_recording', ({ turnIndex, recordings }) => {
      if (roomState) roomState.recordings = recordings;

      const currentTurn = roomState.turns[roomState.currentTurnIndex];
      document.getElementById('rec-text').innerText = 'تم التسجيل بنجاح ✓';
      document.getElementById('rec-btn').classList.replace('bg-amber-600', 'bg-red-600');
      document.getElementById('rec-btn').disabled = true;

      // إظهار أزرار الإسماع والإعادة والاعتماد للجميع
      if (currentTurn.playerId === mySocketId) {
        document.getElementById('listen-btn').classList.remove('hidden');
        document.getElementById('retry-btn').classList.remove('hidden');
        document.getElementById('continue-btn').classList.remove('hidden');
      }
    });

    // 2. إسماع المقطع للجميع مع استبدال الأصوات الأصلية بالصوت الجديد
    function triggerListenBroadcast() {
      socket.emit('broadcast_listen_turn');
    }

    socket.on('on_play_listen_turn', ({ turn, audioData }) => {
      const videoEl = document.getElementById('main-video');
      videoEl.currentTime = turn.startTime;
      
      // كتم الصوت الأصلي للمقطع لتغطية واستبدال أصوات الشخصيات الأصلية بالدوبلاج الجديد!
      videoEl.muted = true; 
      videoEl.play();

      if (activeDubAudio) activeDubAudio.pause();
      activeDubAudio = new Audio(audioData);
      activeDubAudio.play();

      const durationMs = (turn.endTime - turn.startTime) * 1000;
      setTimeout(() => {
        videoEl.pause();
        videoEl.muted = false;
      }, durationMs);
    });

    // إعادة التسجيل
    function retryRecording() {
      resetControlButtons();
      document.getElementById('rec-btn').disabled = false;
      updateTurnUI();
    }

    // الانتقال للدور التالي متزامن للجميع
    function nextTurnBroadcast() {
      socket.emit('next_turn');
    }

    socket.on('turn_changed', ({ currentTurnIndex, isCompleted }) => {
      if (roomState) {
        roomState.currentTurnIndex = currentTurnIndex;
        roomState.isCompleted = isCompleted;
        resetControlButtons();
        updateTurnUI();
      }
    });

    function resetControlButtons() {
      document.getElementById('rec-text').innerText = 'المايك جاهز لدورك';
      document.getElementById('listen-btn').classList.add('hidden');
      document.getElementById('retry-btn').classList.add('hidden');
      document.getElementById('continue-btn').classList.add('hidden');
    }

    // 3. تشغيل الدوبلاج الكامل للمشهد للجميع وقت ما ينتهي المقطع
    function triggerFullDubBroadcast() {
      socket.emit('start_full_dub_sync');
    }

    socket.on('on_start_full_dub', ({ recordings, turns }) => {
      const videoEl = document.getElementById('main-video');
      videoEl.currentTime = 0;
      
      // كتم الفيديو الأصلي طوال فترة وجود دوبلاج تم تسجيله
      videoEl.muted = false; 
      videoEl.play();

      const playedMap = {};

      videoEl.ontimeupdate = () => {
        const curTime = videoEl.currentTime;

        turns.forEach((turn, idx) => {
          const rec = recordings[idx];
          // إذا وصلنا لدور فيه تسجيل صوتي: نكتم صوت المقطع الأصلي ونشغل صوت الدوبلاج
          if (curTime >= turn.startTime && curTime <= turn.endTime) {
            if (rec) {
              videoEl.muted = true; // إخفاء أصوات الشخصيات الأصلية
              if (!playedMap[idx]) {
                playedMap[idx] = true;
                const audio = new Audio(rec.audioData);
                audio.play();
              }
            } else {
              videoEl.muted = false; // لو مافي تسجيل بهذا الجزء يرجع صوت المقطع الأصلي
            }
          }
        });
      };

      videoEl.onended = () => {
        videoEl.muted = false;
      };
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
  </script>
</body>
</html>
